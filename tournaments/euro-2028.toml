# =============================================================================
#  Tournament configuration — UEFA Euro 2028
#
#  A SECOND tournament, added to prove the config drives the app rather than
#  the code. Deliberately a different shape from World Cup 2026: 24 teams in
#  6 groups, and a stage ladder with NO round of 32 — the group stage resolves
#  straight into a round of 16 via the four best third-placed teams.
#
#  A league picks its tournament by id (see League.tournament_id); this file
#  can also be made the deployment default with WC_TOURNAMENT=euro-2028.
#
#  NOTE ON THE TEAM LIST: Euro 2028 qualifying is not complete and the draw has
#  not been made, so the 24 teams and their groups below are a PLACEHOLDER — a
#  plausible field including the UK & Ireland hosts. Replace [[teams]] with the
#  real draw when it happens; nothing in the code depends on these specific
#  entries. Venues and dates are the announced host grounds.
# =============================================================================

id = "euro-2028"
competition_code = "EC"                       # Football-Data.org competition code
sweepstake_name = "The Euro Sweepstake"       # app title (meta.name)
season = "Euro 2028"                          # subtitle (meta.season)
phase = "pre"                                 # pre | live | done

# No r32: 24 teams -> 16, unlike the World Cup's 48 -> 32. This is the whole
# point of the second config — the bracket depth is data, not code.
stage_ladder = ["group", "r16", "qf", "sf", "final", "winner"]

# Home nations: all four hosts get the bespoke draw moments.
special_teams = ["SCO", "ENG", "WAL", "IRL"]

[entry]
fee = 5
charity_split = 0.5

# Not a pre-seeded league: the roster below is empty and `seeded` is false, so
# startup does not create a League row for this tournament. Only the DEFAULT
# tournament's [league] is seeded (see _seed_and_migrate), and giving this one
# a distinct code keeps it from ever colliding with the office league.
[league]
code = "EU28"
name = "The Euro Sweepstake"
password = ""
seeded = false

[stage_labels]
group  = "Group stage"
r16    = "Round of 16"
qf     = "Quarter-final"
sf     = "Semi-final"
final  = "Final"
winner = "Winner"

# 6 groups of 4. Top two plus the four best third-placed teams reach the R16.
[qualification]
groups = 6
group_size = 4
qualify_per_group = 2
best_third_qualifiers = 4

[meta]
stage_label = "Not started"
kickoff = "Fri 9 June"
final_venue = "Wembley Stadium, London"
final_date = "Sun 9 July"
# Local/dev organiser PIN only. Production sets WC_ADMIN_PIN.
admin_pin = "1996"

# --- Fixture schedule generation -------------------------------------------
# Group-stage round-robin knobs; the algorithm lives in wc_data.py.
[schedule]
start_date = 2028-06-09
times = ["17:00", "20:00"]
round_robin = [
  [[0, 1], [2, 3]],
  [[0, 2], [3, 1]],
  [[0, 3], [1, 2]],
]
venues = [
  "Wembley Stadium, London", "Principality Stadium, Cardiff", "Hampden Park, Glasgow",
  "Aviva Stadium, Dublin", "Casement Park, Belfast", "Etihad Stadium, Manchester",
  "Everton Stadium, Liverpool", "St James' Park, Newcastle", "Villa Park, Birmingham",
  "Tottenham Hotspur Stadium, London",
]

