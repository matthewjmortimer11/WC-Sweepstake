# --- Wheesht's commentary ---------------------------------------------------
[lines]
welcome = "A home Euros. Wheesht has waited a long time for this. Wheesht is calm."
drawGood = "A serious side. Wheesht approves — quietly, and without commitment."
drawMid = "Middling. Could go either way. Wheesht is reserving judgement."
drawBad = "…Wheesht is not going to say anything. Lovely flag, though."
drawYou = "A home nation. On home soil. Wheesht is being extremely professional about this."
upset = "Nobody saw that coming. Wheesht did not either. Wheesht's predictions stand regardless."
england = "…Wheesht is remaining professional. It is their tournament too. Allegedly."
scotland = "Scotland. At a home Euros. Wheesht needs a moment and possibly a sit down."
eliminated = "You're out. Wheesht is… sorry. (Wheesht is not sorry. Wheesht saw this coming.)"
sideBets = "You're out. But Wheesht isn't finished with you yet."
sideBets2 = "Watching objectively now. Arguably the better position."
predOpen = "Predictions are open. Back yourself. Wheesht remembers every single one."
predLocked = "Predictions are locked. No takebacks. Wheesht has your answers in writing."
empty = "Nothing here yet. Wheesht is watching the space."
error = "Something went wrong. Wheesht is investigating. Wheesht suspects foul play."
finalBuild = "Two teams left, and Wembley waiting. Wheesht has officiated since 1966. Wheesht is almost speechless."

