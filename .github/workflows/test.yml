name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Builds the JS bundle, which also type-checks nothing but *does* catch
      # JSX syntax errors and cross-file redeclaration clashes before deploy.
      - name: Build frontend
        run: npm ci && npm run build
      # Fails if models.py changed without a matching migration, so the schema
      # and the models can never silently drift apart.
      - name: Check for un-migrated model changes
        env:
          DATABASE_URL: sqlite+aiosqlite:///./.ci_migration_check.db
        run: |
          python scripts/db_upgrade.py
          alembic check
      - name: Run tests
        run: pytest tests/ -q
      - name: Check Dethrone JS syntax
        run: |
          for f in static/dethrone/js/*.js; do
            node --check "$f"
          done
